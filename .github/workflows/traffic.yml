name: Save traffic stats

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and merge traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p traffic
          for kind in clones views; do
            file="traffic/$kind.json"
            [ -f "$file" ] || echo '[]' > "$file"
            gh api "repos/$GITHUB_REPOSITORY/traffic/$kind" > new.json
            # Merge by date: new values replace old ones for the same day
            jq -s --arg kind "$kind" '
              reduce (.[0] + .[1][$kind])[] as $d ({}; .[$d.timestamp] = $d)
              | [.[]] | sort_by(.timestamp)
            ' "$file" new.json > merged.json
            mv merged.json "$file"
          done
          rm -f new.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic
          git diff --cached --quiet || git commit -m "Update traffic stats"
          git push

